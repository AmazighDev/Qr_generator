<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>QR Code Generator</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  :root {
    --bg: #f5f5f4;
    --card-bg: #ffffff;
    --text: #1c1917;
    --muted: #78716c;
    --accent: #0f172a;
    --accent-hover: #1e293b;
    --border: #e7e5e4;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0c0a09;
      --card-bg: #1c1917;
      --text: #f5f5f4;
      --muted: #a8a29e;
      --accent: #e7e5e4;
      --accent-hover: #ffffff;
      --border: #292524;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0c0a09;
    --card-bg: #1c1917;
    --text: #f5f5f4;
    --muted: #a8a29e;
    --accent: #e7e5e4;
    --accent-hover: #ffffff;
    --border: #292524;
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); height: 100%; }
  body {
    height: 100%;
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 32px 16px;
  }
  .card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 28px;
    width: 100%;
    max-width: 420px;
  }
  h1 {
    font-size: 20px;
    margin: 0 0 4px;
  }
  p.subtitle {
    color: var(--muted);
    font-size: 14px;
    margin: 0 0 20px;
  }
  label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    margin-bottom: 6px;
    color: var(--muted);
  }
  textarea {
    width: 100%;
    min-height: 80px;
    padding: 12px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text);
    font-size: 15px;
    font-family: inherit;
    resize: vertical;
    box-sizing: border-box;
  }
  textarea:focus {
    outline: none;
    border-color: var(--accent);
  }
  .row {
    display: flex;
    gap: 10px;
    margin-top: 14px;
    flex-wrap: wrap;
  }
  select {
    flex: 1;
    min-width: 100px;
    padding: 10px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--card-bg);
    color: var(--text);
    font-size: 14px;
  }
  button {
    background: var(--accent);
    color: var(--card-bg);
    border: none;
    padding: 12px 18px;
    border-radius: 10px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    width: 100%;
    margin-top: 14px;
    transition: background 0.15s ease;
  }
  button:hover { background: var(--accent-hover); }
  #qr-output {
    margin-top: 24px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
  }
  #qr-canvas-wrap {
    background: #ffffff;
    padding: 16px;
    border-radius: 12px;
    display: none;
  }
  #download-btn {
    display: none;
    background: transparent;
    color: var(--accent);
    border: 1px solid var(--border);
    width: auto;
    padding: 8px 16px;
    font-size: 13px;
    margin-top: 0;
  }
  #download-btn:hover { background: var(--border); }
</style>
</head>
<body>
  <div class="card">
    <h1>QR Code Generator</h1>
    <p class="subtitle">Paste a link or text, get an instant QR code.</p>

    <label for="data-input">Text or URL</label>
    <textarea id="data-input" placeholder="https://example.com">https://example.com</textarea>

    <div class="row">
      <select id="size-select">
        <option value="200">Small (200px)</option>
        <option value="300" selected>Medium (300px)</option>
        <option value="500">Large (500px)</option>
      </select>
    </div>

    <button id="generate-btn">Generate QR Code</button>

    <div id="qr-output">
      <div id="qr-canvas-wrap"></div>
      <button id="download-btn">Download PNG</button>
    </div>
  </div>

  <script>
    const dataInput = document.getElementById('data-input');
    const sizeSelect = document.getElementById('size-select');
    const generateBtn = document.getElementById('generate-btn');
    const wrap = document.getElementById('qr-canvas-wrap');
    const downloadBtn = document.getElementById('download-btn');
    let currentQR = null;

    function generate() {
      const text = dataInput.value.trim();
      if (!text) return;
      const size = parseInt(sizeSelect.value, 10);

      wrap.innerHTML = '';
      wrap.style.display = 'block';

      currentQR = new QRCode(wrap, {
        text: text,
        width: size,
        height: size,
        colorDark: "#000000",
        colorLight: "#ffffff",
        correctLevel: QRCode.CorrectLevel.M
      });

      downloadBtn.style.display = 'inline-block';
    }

    downloadBtn.addEventListener('click', () => {
      const img = wrap.querySelector('img');
      const canvas = wrap.querySelector('canvas');
      const src = img ? img.src : (canvas ? canvas.toDataURL('image/png') : null);
      if (!src) return;
      const a = document.createElement('a');
      a.href = src;
      a.download = 'qrcode.png';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    });

    generateBtn.addEventListener('click', generate);
    dataInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && e.ctrlKey) generate();
    });

    // generate one on load
    window.addEventListener('load', generate);
  </script>
</body>
</html>
